name: Publish MPC ceremony candidate

on:
  push:
    tags: ["mpc-v*"]
  workflow_dispatch:
    inputs:
      source_tag:
        description: Signed mpc-v* tag to build
        required: true
        type: string

# This workflow publishes an attested *candidate* only. The offline build
# signing key is intentionally unavailable to GitHub Actions, so a successful
# run can never create a production package.
permissions:
  contents: read
  attestations: write
  id-token: write

concurrency:
  group: mpc-ceremony-candidate-${{ inputs.source_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Reproducible signed-tag candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_TAG: ${{ inputs.source_tag || github.ref_name }}
      TAG_SIGNER_FINGERPRINT: D27746F50177107AF060C35B69375FD4AA575389
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Authenticate the source tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.6
          test "$(go env GOHOSTOS)" = linux
          test "$(go env GOHOSTARCH)" = amd64
          test "$(sed -n 's/^module //p' go.mod)" = proof-tool
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import release/keys/relay-tag-signing-public.asc
          verified=$(git verify-tag --raw "$SOURCE_TAG" 2>&1)
          printf '%s\n' "$verified"
          printf '%s\n' "$verified" | grep -q "^\[GNUPG:\] VALIDSIG $TAG_SIGNER_FINGERPRINT "
          test "$(git rev-parse "$SOURCE_TAG^{commit}")" = "$(git rev-parse HEAD)"

      - name: Bootstrap patched vendor tree
        run: bash scripts/bootstrap-vendor.sh

      - name: Build two signed-tag candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/mpc-candidate-a-parent"
          mkdir "$RUNNER_TEMP/mpc-candidate-b-parent"
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          scripts/build-mpc-ceremony-release.sh \
            --mode candidate \
            --signed-tag "$SOURCE_TAG" \
            --tag-signer-fingerprint "$TAG_SIGNER_FINGERPRINT" \
            --out-dir "$RUNNER_TEMP/mpc-candidate-a-parent/release"
          scripts/build-mpc-ceremony-release.sh \
            --mode candidate \
            --signed-tag "$SOURCE_TAG" \
            --tag-signer-fingerprint "$TAG_SIGNER_FINGERPRINT" \
            --out-dir "$RUNNER_TEMP/mpc-candidate-b-parent/release"

      - name: Verify byte-for-byte reproducibility
        shell: bash
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          scripts/verify-mpc-ceremony-reproducible.sh \
            --mode candidate \
            --expected-commit "$(git rev-parse HEAD)" \
            --expected-tag "$SOURCE_TAG" \
            --tag-signer-fingerprint "$TAG_SIGNER_FINGERPRINT" \
            --trusted-build-public-key-file none \
            "$RUNNER_TEMP/mpc-candidate-a-parent/release" \
            "$RUNNER_TEMP/mpc-candidate-b-parent/release"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mpc-ceremony-candidate-${{ env.SOURCE_TAG }}
          path: ${{ runner.temp }}/mpc-candidate-a-parent/release
          if-no-files-found: error

      - name: Attest the candidate package
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: ${{ runner.temp }}/mpc-candidate-a-parent/release
